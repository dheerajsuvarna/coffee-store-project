version: '3.8'

networks:
  medusa-network:
    driver: bridge

volumes:
  postgres-data:

services:
  db:
    image: postgres:15-alpine
    container_name: medusa_db
    networks:
      - medusa-network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: medusa_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d medusa_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: medusa_redis
    networks:
      - medusa-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./coffee-store
    container_name: medusa_backend
    networks:
      - medusa-network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "9000:9000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres_password@db:5432/medusa_db?sslmode=disable
      - REDIS_URL=redis://redis:6379
      # CORS: allow both storefront (port 3000) and admin panel origins
      - STORE_CORS=http://localhost:3000,http://storefront:3000
      - ADMIN_CORS=http://localhost:9000,http://backend:9000
      - AUTH_CORS=http://localhost:9000,http://localhost:3000,http://storefront:3000
      - JWT_SECRET=supersecret
      - COOKIE_SECRET=supersecret
      - NODE_ENV=development

    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:9000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  storefront:
    build:
      context: ./coffee-store-storefront
      # NEXT_PUBLIC_ vars are baked into the JS bundle at build time.
      # Use localhost:9000 here so the browser (outside Docker) can reach the backend.
      args:
        - NEXT_PUBLIC_MEDUSA_BACKEND_URL=http://localhost:9000
    container_name: medusa_storefront
    networks:
      - medusa-network
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Browser (client-side) — reaches backend via the host-mapped port
      - NEXT_PUBLIC_MEDUSA_BACKEND_URL=http://localhost:9000
      # Server-side (SSR/RSC) — uses the Docker service name as hostname
      - MEDUSA_BACKEND_URL=http://backend:9000
      - NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=pk_ca79ab9c6d267d18cc34efb4021f879965d1660166300e99a34e1caf10f3112f
      - NEXT_PUBLIC_BASE_URL=http://localhost:3000
      - NEXT_PUBLIC_DEFAULT_REGION=us
      - REVALIDATE_SECRET=supersecret
    # Run dev server on port 3000 (reads env vars at runtime, avoiding baked-in localhost issues)
    command: npx next dev -p 3000
